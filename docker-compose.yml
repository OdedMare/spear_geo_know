# docker compose up -d --build   →   http://localhost:3000
services:
  geo-games:
    build:
      context: .
      args:
        # For a network with no internet: an internal base image and npm mirror.
        NODE_IMAGE: ${NODE_IMAGE:-node:24.1.0-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: geo-games
    restart: unless-stopped
    ports:
      - "${GEO_PORT:-3000}:3000"
    environment:
      # Opens /admin, where real prizes are marked as handed over. Leave empty to keep it off.
      GEO_ADMIN_KEY: ${GEO_ADMIN_KEY:-}
    volumes:
      # Keeps the team table across restarts and upgrades.
      - geo-scores:/app/data

volumes:
  geo-scores:
